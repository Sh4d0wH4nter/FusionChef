<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nutrition · FusionChef</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div class="wrap">
  <header>
    <div><h1>Nutrition</h1><div class="sub" id="date"></div></div>
    <div id="nav"></div>
  </header>
  <div class="grid2">
    <section class="panel today">
      <div class="bigring" id="bigring"></div>
      <div class="bars" id="bars"></div>
      <label class="sub">Daily goal <input id="goal" type="number" min="500" step="50" style="width:90px"> kcal</label>
      <form class="logform" id="lf" autocomplete="off">
        <input id="ln" placeholder="Log food or meal" required>
        <input id="lk" type="number" min="0" placeholder="kcal" required>
        <div class="macro-in">
          <input id="lp" type="number" min="0" placeholder="protein g">
          <input id="lc" type="number" min="0" placeholder="carbs g">
          <input id="lfat" type="number" min="0" placeholder="fat g">
        </div>
        <button class="btn">Add to today</button>
      </form>
      <div class="loglist" id="loglist"></div>
    </section>
    <section>
      <h2 style="margin:0 0 12px">Saved recipes</h2>
      <div class="rgrid" id="recipes"></div>
    </section>
  </div>
</div>
<script src="/js/common.js"></script>
<script src="/js/nutrition.js"></script>
</body>
</html>
